  const views=vals.reduce((a,b)=>a+b,0),clicks=d.links.reduce((a,l)=>a+l.clicks,0);
  const tabs=[['links','ลิงก์'],['profile','โปรไฟล์'],['design','ดีไซน์'],['stats','สถิติ'],['tools','เครื่องมือ']];
  return <aside className="drawer fixed top-0 right-0 bottom-0 z-40 w-full sm:w-[420px] overflow-y-auto" style={{background:'rgba(12,12,15,.94)',backdropFilter:'blur(24px)',borderLeft:'1px solid rgba(255,255,255,.1)',paddingTop:'env(safe-area-inset-top,0px)'}}>
    <div className="sticky top-0 z-10 flex items-center gap-2 p-4" style={{background:'rgba(12,12,15,.96)'}}>
      <div className="flex-1"><h2 className="serif text-2xl leading-none">Dashboard</h2><div className="flex items-center gap-1.5 text-[11px] mt-1" style={{color:'var(--mu)'}}><span className="live"/>Live · บันทึกอัตโนมัติ</div></div>
      <button onClick={onLogout} className="text-xs px-3 py-1.5 rounded-lg glass">ออกจากระบบ</button>
      <button onClick={onClose} aria-label="ปิด" className="p-2 rounded-lg glass"><Ic n="x" s={18}/></button>
    </div>
    <div className="px-4 flex gap-2 mb-4">{tabs.map(([k,t])=><button key={k} onClick={()=>setTab(k)} className={'flex-1 py-2 rounded-xl text-[13px] '+(tab===k?'pro font-semibold':'glass')}>{t}</button>)}</div>
    <div className="px-4 pb-24">
    {tab==='profile'&&<div className="pop">
      <Field l="ชื่อ"><input value={d.profile.name} onChange={e=>pf({name:e.target.value})}/></Field>
      <Field l="รูปโปรไฟล์ (URL)"><input value={d.profile.avatar} placeholder="https://..." onChange={e=>pf({avatar:e.target.value})}/></Field>
      <Field l="Bio"><textarea rows="3" value={d.profile.bio} onChange={e=>pf({bio:e.target.value})}/></Field>
      <Field l="Bio (English)"><textarea rows="2" value={d.profile.bioEn??BIO_EN} onChange={e=>pf({bioEn:e.target.value})}/></Field>
      <Field l="ป้ายสถานะ (เว้นว่างเพื่อซ่อน)"><input value={d.profile.badge} onChange={e=>pf({badge:e.target.value})}/></Field>
      <Field l="สี Accent"><div className="flex gap-2 items-center"><input type="color" value={d.profile.accent} onChange={e=>pf({accent:e.target.value})} style={{width:56,height:40,padding:2}}/>{['#f5a524','#e8c26b','#ff7a3d','#d946ef','#22d3ee'].map(c=><button key={c} aria-label={c} onClick={()=>pf({accent:c})} className="w-8 h-8 rounded-full" style={{background:c,border:'2px solid rgba(255,255,255,.3)'}}/>)}</div></Field>
    </div>}
    {tab==='design'&&<div className="pop">
      <Box l="สไตล์การ์ด"><Seg v={d.ui.cs} on={v=>ui({cs:v})} o={[['glass','กระจก'],['solid','ทึบ'],['outline','เส้นขอบ']]}/></Box>
      <Box l="ฟอนต์หัวข้อ"><Seg v={d.ui.ft} on={v=>ui({ft:v})} o={[['serif','เซอริฟหรู'],['sans','สมัยใหม่']]}/></Box>
      <Box l="รูปโปรไฟล์"><Seg v={d.ui.avatar} on={v=>ui({avatar:v})} o={[['circle','วงกลม'],['squircle','มน'],['square','เหลี่ยม']]}/></Box>
      <Box l={'มุมโค้งการ์ด '+d.ui.r+'px'}><input type="range" min="0" max="36" value={d.ui.r} onChange={e=>ui({r:+e.target.value})}/></Box>
      <Box l={'ระยะห่างการ์ด '+d.ui.gap+'px'}><input type="range" min="4" max="28" value={d.ui.gap} onChange={e=>ui({gap:+e.target.value})}/></Box>
      <div className="glass rounded-2xl px-3 mb-4">{[['dust','ฝุ่นทองลอย'],['aur','แสงออโรร่าพื้นหลัง'],['bm','เส้นแสงวิ่งรอบการ์ด'],['tilt','การ์ดเอียง 3D'],['sp','สปอตไลต์ตามเมาส์'],['confetti','คอนเฟตตีตอนกดลิงก์'],['stats','แสดงสถิติ'],['verified','เครื่องหมายยืนยัน'],['bannerOn','แถบประกาศวิ่ง']].map(([k,t])=><div key={k} className="flex items-center justify-between py-2.5 text-sm"><span>{t}</span><Sw on={d.ui[k]} set={v=>ui({[k]:v})} label={t}/></div>)}</div>
      <Field l="ข้อความแถบประกาศ"><input value={d.ui.banner} onChange={e=>ui({banner:e.target.value})}/></Field>
      <Field l="ข้อความพิมพ์ดีด (คั่นหลายข้อความด้วย |)"><input value={d.ui.tagline} onChange={e=>ui({tagline:e.target.value})}/></Field>
      <Field l="Typewriter text (English, separate with |)"><input value={d.ui.taglineEn??TAG_EN} onChange={e=>ui({taglineEn:e.target.value})}/></Field>
      <Field l="ข้อความท้ายหน้า (เว้นว่างใช้ชื่อ)"><input value={d.ui.footer} onChange={e=>ui({footer:e.target.value})}/></Field>
    </div>}
    {tab==='tools'&&<div className="pop space-y-3">
      <button onClick={()=>setTxt(JSON.stringify(d))} className="w-full py-2.5 rounded-xl glass text-sm">สร้างข้อมูลสำรอง</button>
      <textarea rows="5" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="คัดลอกข้อความนี้เก็บไว้ หรือวางข้อมูลสำรองเพื่อนำเข้า"/>
      <button onClick={()=>{try{const p=JSON.parse(txt);if(!p.links||!p.profile)throw 0;set({...p,ui:{...UI,...(p.ui||{})}});setMsg('นำเข้าสำเร็จ')}catch(e){setMsg('ข้อมูลไม่ถูกต้อง ตรวจสอบข้อความอีกครั้ง')}}} className="w-full py-2.5 rounded-xl pro font-semibold text-sm">นำเข้าข้อมูล</button>
      <button onClick={()=>{set(s=>({...s,daily:{},links:s.links.map(l=>({...l,clicks:0})),log:[{t:Date.now(),m:'ล้างสถิติ'}]}));setMsg('ล้างสถิติแล้ว')}} className="w-full py-2.5 rounded-xl glass text-sm">ล้างสถิติ</button>
      <button onClick={()=>{if(!cf)return setCf(true);set({...seed(),ui:{...UI}});setCf(false);setMsg('รีเซ็ตแล้ว')}} className="w-full py-2.5 rounded-xl glass text-sm" style={{color:'#ff7a7a'}}>{cf?'กดอีกครั้งเพื่อยืนยันรีเซ็ตทั้งหมด':'รีเซ็ตเว็บเป็นค่าเริ่มต้น'}</button>
      {msg&&<p role="status" className="text-xs text-center" style={{color:'var(--ac)'}}>{msg}</p>}
    </div>}
    {tab==='links'&&<div className="pop space-y-3">
      {d.links.map((l,i)=><div key={l.id} draggable onDragStart={()=>setDrag(i)} onDragOver={e=>e.preventDefault()} onDrop={()=>drop(i)} className="glass rounded-2xl p-3" style={{opacity:drag===i?.4:1}}>
        <div className="flex items-center gap-2 mb-2">
          <span className="cursor-grab" style={{color:'var(--mu)'}} title="ลากเพื่อจัดลำดับ"><Ic n="grip" s={18}/></span>
          <span style={{color:'var(--ac)'}}><Ic n={l.platform} s={18}/></span>
          <input className="!py-1.5 flex-1" value={l.title} onChange={e=>up(l.id,{title:e.target.value})} aria-label="ชื่อ"/>
          <Sw on={l.visible} set={v=>up(l.id,{visible:v})} label="แสดง/ซ่อน"/>
          <button onClick={()=>mv(i,-1)} aria-label="เลื่อนขึ้น" className="px-1 text-sm" style={{color:'var(--mu)'}}>↑</button><button onClick={()=>mv(i,1)} aria-label="เลื่อนลง" className="px-1 text-sm" style={{color:'var(--mu)'}}>↓</button>
          <button onClick={()=>del(l.id)} aria-label="ลบ" className="p-1.5" style={{color:'#ff7a7a'}}><Ic n="trash" s={18}/></button>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <select value={l.platform} onChange={e=>up(l.id,{platform:e.target.value})}>{PLAT.map(p=><option key={p}>{p}</option>)}</select>
          <select value={l.tag} onChange={e=>up(l.id,{tag:e.target.value})}>{TAGS.map(t=><option key={t} value={t}>{t||'ไม่มีแท็ก'}</option>)}</select>
          <input value={l.handle} onChange={e=>up(l.id,{handle:e.target.value})} placeholder="@handle"/>
          <input type="number" min="0" value={l.followers} onChange={e=>up(l.id,{followers:Math.max(0,+e.target.value||0)})} placeholder="ผู้ติดตาม"/>
          <input className="col-span-2" value={l.url} onChange={e=>up(l.id,{url:e.target.value})} placeholder="https://"/>
        </div>
      </div>)}
      <button onClick={add} className="w-full py-3 rounded-2xl glass flex items-center justify-center gap-2" style={{color:'var(--ac)'}}><Ic n="plus" s={18}/>เพิ่มลิงก์</button>
    </div>}
    {tab==='stats'&&<div className="pop">
      <div className="grid grid-cols-3 gap-2 mb-4">{[['เข้าชมรวม',views],['คลิกรวม',clicks],['CTR',(views?clicks/views*100:0).toFixed(1)+'%']].map(([a,b])=><div key={a} className="glass rounded-2xl p-3 text-center"><div className="serif text-2xl" style={{color:'var(--ac)'}}>{typeof b==='number'?fmt(b):b}</div><div className="text-[11px]" style={{color:'var(--mu)'}}>{a}</div></div>)}</div>
      <div className="glass rounded-2xl p-3 mb-4"><div className="text-xs mb-2" style={{color:'var(--mu)'}}>Pageviews 7 วันล่าสุด</div><Chart vals={vals} labels={days.map(k=>k.slice(5))}/></div>
      <div className="glass rounded-2xl p-3 mb-4"><div className="text-xs mb-3" style={{color:'var(--mu)'}}>คลิกต่อช่องทาง</div>
        {d.links.map(l=>{const mx=Math.max(...d.links.map(x=>x.clicks),1);return <div key={l.id} className="mb-2"><div className="flex justify-between text-xs mb-1"><span>{l.title}</span><span style={{color:'var(--mu)'}}>{l.clicks} คลิก · {(views?l.clicks/views*100:0).toFixed(1)}%</span></div><div className="h-1.5 rounded-full" style={{background:'rgba(255,255,255,.08)'}}><div className="h-full rounded-full" style={{width:l.clicks/mx*100+'%',background:'var(--ac)',transition:'width .5s'}}/></div></div>})}</div>
      <div className="glass rounded-2xl p-3"><div className="text-xs mb-2" style={{color:'var(--mu)'}}>กิจกรรมล่าสุด</div>
        {d.log.slice(0,8).map((x,i)=><div key={i} className="flex justify-between text-xs py-1.5 border-b" style={{borderColor:'rgba(255,255,255,.06)'}}><span>{x.m}</span><span style={{color:'var(--mu)'}}>{new Date(x.t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</span></div>)}</div>
    </div>}
    </div>
  </aside>;
}

function App(){
  const [d,set]=useState(load);
  const [pin,setPin]=useState(false),[admin,setAdmin]=useState(false),[snd,setSnd]=useState(false);
  const au=useRef(null);
  const [hashOn,setHashOn]=useState(()=>location.hash==='#admin');
  useEffect(()=>{const f=()=>setHashOn(location.hash==='#admin');window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);
  const showKey=hashOn||admin||!!sess();
  const taps=useRef({n:0,t:0});const [toast,setToast]=useState('');
  const [lang,setLang]=useState(()=>{try{return localStorage.getItem('aurora-lang')||'th'}catch(e){return'th'}});
  const tr=(a,b)=>lang==='en'?b:a;
  useEffect(()=>{try{localStorage.setItem('aurora-lang',lang)}catch(e){}document.documentElement.lang=lang;return i18n(lang)},[lang]);
  const share=async()=>{const u=location.href.split('#')[0];try{await navigator.clipboard.writeText(u);setToast(tr('คัดลอกลิงก์แล้ว','Link copied'))}catch(e){setToast(tr('คัดลอกไม่สำเร็จ','Copy failed'))}setTimeout(()=>setToast(''),1800)};
  const secret=()=>{const now=Date.now(),k=taps.current;k.n=now-k.t<2000?k.n+1:1;k.t=now;if(k.n>=5){k.n=0;admin?setAdmin(false):sess()?setAdmin(true):setPin(true)}};

  // --- Realtime Sync กับ Firebase Firestore ---
  const isUpdatingFromRemote = useRef(false);
  const loadedRef = useRef(false);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    if (!docRef) { setReady(true); return; }
    const unsub = docRef.onSnapshot((snapshot) => {
      if (snapshot.metadata.hasPendingWrites) return; // ข้ามเสียงสะท้อนจากการเขียนของเราเอง
      loadedRef.current = true;
      setReady(true);
      if (snapshot.exists) {
        const data = snapshot.data();
        isUpdatingFromRemote.current = true;
        set(s => ({
          ...s,
          ...data,
          ui: { ...UI, ...(data.ui || {}) }
        }));
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
      } else {
        // หาก Database ยังว่างเปล่า ให้สร้างข้อมูลตั้งต้น
        const initData = load();
        docRef.set(initData).catch(console.error);
      }
    }, (err) => { console.error("Firebase listen error:", err); setReady(true); });
    return () => unsub();
  }, []);

  // บันทึกขึ้น Firebase เมื่อมีการเปลี่ยนแปลงข้อมูลจากฝั่ง Admin
  const isFirstRun = useRef(true);
  useEffect(() => {
    if (isFirstRun.current) {
      isFirstRun.current = false;
      return;
    }
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
    if (!docRef || !loadedRef.current) return; // ห้ามเขียนทับก่อนโหลดข้อมูลจริงจาก Firebase
    if (isUpdatingFromRemote.current) {
      isUpdatingFromRemote.current = false;
      return;
    }
    docRef.set(d).catch(err => console.error("Firebase save error:", err));
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
  }, [d]);

  useEffect(()=>{document.documentElement.style.setProperty('--ac',d.profile.accent)},[d.profile.accent]);
  useEffect(()=>{const b=document.body,u=d.ui;b.dataset.cs=u.cs;b.dataset.ft=u.ft;b.dataset.sp=u.sp?'on':'off';b.dataset.bm=u.bm?'on':'off';b.style.setProperty('--r',u.r+'px')},[d.ui]);
  useEffect(()=>{document.title=d.profile.name+' — Bio-Link'},[d.profile.name]);
  useEffect(()=>{document.body.classList.toggle('adm',admin)},[admin]);
  useEffect(()=>{if(ready)set(s=>({...s,daily:{...s.daily,[today()]:(s.daily[today()]||0)+1}}))},[ready]);
  const click=l=>set(s=>({...s,links:s.links.map(x=>x.id===l.id?{...x,clicks:x.clicks+1}:x),log:[{t:Date.now(),m:'คลิก '+l.title},...s.log].slice(0,20)}));
  const toggleSnd=()=>{
    if(snd&&au.current){au.current.close();au.current=null;setSnd(false);return}
    try{const c=new (window.AudioContext||window.webkitAudioContext)(),g=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=500;g.gain.value=0;g.gain.linearRampToValueAtTime(.05,c.currentTime+2);
      [110,164.8,220.4].forEach(h=>{const o=c.createOscillator();o.type='sine';o.frequency.value=h;o.connect(f);o.start()});f.connect(g);g.connect(c.destination);au.current=c;setSnd(true)}catch(e){}
  };
  const theme=()=>set(s=>{const amber=s.profile.theme==='amber';return{...s,profile:{...s.profile,theme:amber?'obsidian':'amber',accent:amber?'#e8c26b':'#f5a524'}}});
  const vis=d.links.filter(l=>l.visible);
  return <LC.Provider value={lang}><div className="relative" style={{paddingRight:0}}>
    <div className="glow"/>{d.ui.aur&&<div className="aur"/>}<Dust on={d.ui.dust} ac={d.profile.accent}/>
    {d.ui.bannerOn&&d.ui.banner&&<div className="mq relative z-20 text-xs py-2" style={{background:'color-mix(in srgb,var(--ac) 16%,#09090b)',color:'var(--ac)'}}><span>{d.ui.banner}</span></div>}
    <main className="relative z-10 max-w-md mx-auto px-4 pb-28" style={{transition:'transform .35s'}}>
      <Profile d={d} visible={vis}/>
      <div className="grid" style={{gap:d.ui.gap}}>{vis.map((l,i)=><LinkCard key={l.id} l={l} i={i} onClick={click} ui={d.ui}/>)}
        {!vis.length&&<p className="text-center text-sm" style={{color:'var(--mu)'}}>{tr('ยังไม่มีลิงก์ที่แสดง — เปิดสวิตช์ในหลังบ้าน','No links to show yet')}</p>}</div>
      <p onClick={secret} className="text-center text-[11px] mt-10 select-none" style={{color:'#5c5a54',touchAction:'manipulation',WebkitTapHighlightColor:'transparent'}}>© {new Date().getFullYear()} {d.ui.footer||d.profile.name}</p>
    </main>
    <div className="fixed z-30 left-0 right-0 flex justify-center gap-3" style={{bottom:'calc(env(safe-area-inset-bottom,0px) + 16px)'}}>
      {toast&&<div className="pop fixed glass rounded-full px-4 py-2 text-xs z-50" style={{left:0,right:0,margin:'auto',width:'max-content',bottom:'calc(env(safe-area-inset-bottom,0px) + 72px)'}}>{toast}</div>}
      <button onClick={()=>setLang(l=>l==='en'?'th':'en')} aria-label="Language" className="glass w-11 h-11 rounded-full grid place-items-center text-xs font-semibold" style={{color:'var(--ac)'}}>{lang==='en'?'TH':'EN'}</button>
      <button onClick={share} aria-label="แชร์ลิงก์" className="glass w-11 h-11 rounded-full grid place-items-center" style={{color:'var(--ac)'}}><Ic n="share" s={18}/></button>
      <button onClick={toggleSnd} aria-label="เสียง" className="glass w-11 h-11 rounded-full grid place-items-center" style={{color:snd?'var(--ac)':'var(--mu)'}}><Ic n={snd?'volume':'mute'} s={18}/></button>
      <button onClick={theme} aria-label="สลับธีม" className="glass w-11 h-11 rounded-full grid place-items-center" style={{color:'var(--ac)'}}><Ic n="palette" s={18}/></button>
      {showKey&&<button onClick={()=>admin?setAdmin(false):sess()?setAdmin(true):setPin(true)} aria-label="Admin" className="w-11 h-11 rounded-full grid place-items-center opacity-30 hover:opacity-100 transition" style={{color:'var(--mu)'}}><Ic n="key" s={16}/></button>}
    </div>
    {pin&&<PinModal onOk={(e,n)=>{setPin(false);setAdmin(true);set(s=>({...s,log:[{t:Date.now(),m:(n?'สมัครบัญชี: ':'เข้าสู่ระบบ: ')+e},...s.log].slice(0,20)}))}} onClose={()=>setPin(false)}/>}
    {admin&&<Admin d={d} set={set} onClose={()=>setAdmin(false)} onLogout={()=>{try{sessionStorage.removeItem(SKEY)}catch(e){}setAdmin(false)}}/>}
  </div></LC.Provider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
